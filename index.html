<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V Media CRM</title>
<meta name="description" content="V Media CRM – leads, productions, clients and automations for V Media Production in one place." />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<!-- The CRM runs in a GitHub Codespace (GitHub Pages cannot run its server): go straight to its dashboard. -->
<meta http-equiv="refresh" content="0; url=https://effective-computing-machine-g5x7q94vjrpfv9w9-4700.app.github.dev/app/dashboard" />
<script>location.replace('https://effective-computing-machine-g5x7q94vjrpfv9w9-4700.app.github.dev/app/dashboard');</script>
<style>
  :root { --bg: #0d0c0c; --panel: #171515; --text: #f3efeb; --muted: #a8a19a; --line: #2b2726; --accent: #d91c24; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 80% -10%, #3a0d10 0%, transparent 60%), var(--bg); color: var(--text); font: 16px/1.55 Inter, system-ui, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 520px; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font: 800 28px/1.2 system-ui, sans-serif; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 10px; }
  .login { margin-top: 20px; font-size: 14px; color: var(--muted); }
  code { color: var(--text); }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="" />
  <h1>Opening V Media CRM…</h1>
  <p>If nothing happens, use the button. If it still doesn’t open, the test server is asleep – it wakes up when the owner starts it on GitHub.</p>
  <a class="btn" href="https://effective-computing-machine-g5x7q94vjrpfv9w9-4700.app.github.dev/app/dashboard">Open the dashboard</a>
  <div class="login">Demo login: <code>demo@example.com</code> / <code>demo1234</code> · GitHub first shows a “development port” notice – click Continue.</div>
</main>
</body>
</html>
